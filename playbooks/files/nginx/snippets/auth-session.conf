# Server-side session cache for one site's basic auth.
#
# Included from a server block that sets $basic_auth_file to its htpasswd
# basename and uses `auth_request /_auth;` where it previously used
# auth_basic. Requires conf.d/auth-session.conf (installed by nginx.yaml).
# proxy_cache_lock collapses a burst of first requests into a single
# bcrypt verification instead of racing one per request.
location = /_auth {
    internal;
    proxy_pass http://127.0.0.1:50019/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Basic-Auth-File $basic_auth_file;
    proxy_cache auth_session;
    # Site name in the key, so a credential cached for one site is never
    # accepted on another.
    proxy_cache_key $basic_auth_file:$http_authorization;
    proxy_cache_valid 200 10m;
    proxy_cache_valid 401 30s;
    proxy_cache_lock on;
    access_log off;
}
