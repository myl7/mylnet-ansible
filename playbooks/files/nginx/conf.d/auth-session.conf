# Server-side session cache for basic-auth sites.
#
# Sites replace their auth_basic pair with `auth_request /_auth;` plus
# `include snippets/auth-session.conf;` and set $fe_auth_file to their
# htpasswd basename. One real (bcrypt) verification per credential per
# 10 minutes; every other request hits this cache sub-millisecond.
# Wrong credentials get a 30s negative cache, which also rate-limits
# password guessing through the front door.

proxy_cache_path /var/cache/nginx/auth keys_zone=auth_session:1m max_size=4m
    inactive=15m use_temp_path=off;

# Whitelist of htpasswd files the internal checker may read. The empty
# default makes any other X-FE-Auth-File fail closed (an unreadable
# auth_basic_user_file errors out instead of letting the request in).
map $http_x_fe_auth_file $fe_auth_file_map {
    default "";
    cityu-print cityu-print;
    dav dav;
    file-edit-mcp file-edit-mcp;
    mylnet-proxy-rules mylnet-proxy-rules;
}

# Requests that must authenticate: everything except read-only methods,
# for sites serving public GETs (dav /public/). auth_request cannot be
# placed inside limit_except (auth_basic can), so gate it with a variable
# instead: auth_request $fe_public_auth.
map $request_method $fe_public_auth {
    default /_auth;
    GET off;
    HEAD off;
}

# The real verification happens here, loopback-only. auth_basic runs in
# the access phase and empty_gif serves the 2xx in the content phase; a
# plain `return` would run in the rewrite phase and skip auth entirely.
server {
    listen 127.0.0.1:50019;
    server_name _;

    location = /check {
        auth_basic "auth";
        auth_basic_user_file /etc/nginx/htpasswd/$fe_auth_file_map;
        empty_gif;
        access_log off;
    }
}
