<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Service Console</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #0b1020;
        color: #e8edf7;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #18284a 0, transparent 42%), #0b1020;
      }

      main {
        width: min(560px, calc(100% - 48px));
        padding: 36px;
        border: 1px solid #283753;
        border-radius: 14px;
        background: rgba(16, 24, 43, 0.94);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .mark {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: #2b6df3;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
      }

      p {
        margin: 8px 0 0;
        color: #9eabc1;
        line-height: 1.55;
      }

      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 26px;
        padding: 18px 20px;
        border: 1px solid #293853;
        border-radius: 10px;
        background: #0c1426;
      }

      .state {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #b9f6ce;
        font-weight: 600;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #48d581;
        box-shadow: 0 0 0 5px rgba(72, 213, 129, 0.12);
      }

      .meta {
        color: #748198;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark">SC</div>
        <div>
          <h1>Service Console</h1>
          <p>Private infrastructure management endpoint</p>
        </div>
      </header>
      <div class="status">
        <div class="state"><span class="dot"></span>Operational</div>
        <div class="meta">TLS endpoint</div>
      </div>
    </main>
  </body>
</html>
