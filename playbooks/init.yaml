# Already-initialized hosts can still run this playbook, but without side_effect plays.
---
# Assume SSH and apt.
# Assume python3 in apt fits Ansible.
- name: Init newly-created hosts
  hosts: raw, hosts
  gather_facts: false
  become: true

  vars:
    # zram size as a percentage of RAM, so hosts with different amounts of
    # memory scale on their own.
    zram_percent: 50
    swap_file_size: 1G

  vars_files:
    - secrets/secrets.yaml

  pre_tasks:
    - name: Check password_hash
      ansible.builtin.assert:
        that:
          - password_hash is defined
        fail_msg: "Set password_hash in secrets.yaml"
        quiet: true

  tasks:
    - name: Bootstrap Python for Ansible
      ansible.builtin.raw: |
        if command -v python3 >/dev/null 2>&1; then
          echo "python3 present"
        else
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-apt
          echo "python3 installed"
        fi
      register: bootstrap_python
      changed_when: "'python3 installed' in bootstrap_python.stdout"

    - name: Gather facts
      ansible.builtin.setup:

    # Before the upgrade: this is the heaviest step of the play on a small
    # host, and the point of the swap below is to be there when memory runs
    # out. A host with no swap anywhere can only reclaim page cache, so once
    # memory runs out it evicts the cache and then spends all its CPU faulting
    # that cache back in from disk. zram gives the kernel somewhere cheap to
    # put anonymous pages: they stay in RAM, compressed, and the cache
    # survives. The swap file is the overflow for when even that fills.
    - name: Install zram tools
      ansible.builtin.apt:
        name:
          - zram-tools
        state: present
        update_cache: true

    - name: Configure zram swap
      ansible.builtin.copy:
        content: |
          # Managed by mylnet-ansible init.yaml.
          ALGO=zstd
          PERCENT={{ zram_percent }}
          PRIORITY=100
        dest: /etc/default/zramswap
        owner: root
        group: root
        mode: "0644"
      notify: Restart zram swap

    # Priority 100 beats the 10 on the swap file below, so zram takes the
    # first hit and the disk only sees what zram could not hold.
    - name: Start and enable zram swap
      ansible.builtin.systemd_service:
        name: zramswap.service
        state: started
        enabled: true
        daemon_reload: true

    - name: Create swap file
      ansible.builtin.command:
        cmd: fallocate -l {{ swap_file_size }} /swapfile
        creates: /swapfile

    - name: Restrict swap file
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: List active swap devices
      ansible.builtin.command:
        cmd: swapon --show=NAME --noheadings
      register: swap_active
      changed_when: false

    - name: Read swap file signature
      ansible.builtin.command:
        cmd: blkid -o value -s TYPE /swapfile
      register: swap_file_type
      changed_when: false
      failed_when: false

    # Two guards, not one. A file that is active as swap must never have a new
    # signature written over it, and that has to hold even if blkid fails to
    # report the signature of a file in use.
    - name: Format swap file
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when:
        - swap_file_type.stdout | trim != "swap"
        - "'/swapfile' not in swap_active.stdout"
      changed_when: true

    - name: Configure swap file in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s'
        line: "/swapfile none swap sw,pri=10 0 0"

    # swapon -a, not swapon /swapfile: only the former reads the priority out
    # of fstab. Enabling the file by path gives it the kernel default instead,
    # which on a host that already swaps somewhere else leaves the ordering
    # wrong until the next boot. Devices already in use are skipped.
    - name: Enable swap file
      ansible.builtin.command:
        cmd: swapon -a
      when: "'/swapfile' not in swap_active.stdout"
      changed_when: true

    - name: Upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: "yes"

    - name: Install basic packages
      ansible.builtin.apt:
        name:
          - python3
          - sudo
          - build-essential
          - bash
          - neovim
          - git
          - nftables
          - htop
          - net-tools
          - dnsutils
          - ncdu
          - curl
          - wget
          - rsync
          - ca-certificates
          - cron
          - tmux
          - python3-debian # For deb822_repository module
        state: present

    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname_short }}"

    - name: Update hosts for hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^(127\.0\.1\.1|{{ ansible_host | regex_escape }})\s+'
        line: "{{ ansible_host }} {{ inventory_hostname_short }}"

    - name: Update SSH config
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        insertbefore: BOF
        block: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          Port 50000
          UseDNS no
          # lynis SSH-7408
          X11Forwarding no
          AllowAgentForwarding no
          LogLevel VERBOSE
        validate: /usr/sbin/sshd -t -f %s
      register: ssh_config

    - name: Comment old SSH config
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        after: "# END ANSIBLE MANAGED BLOCK"
        regexp: '^(\s*{{ item }}[ \t=].*)$'
        replace: '# \1'
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - PermitRootLogin
        - PasswordAuthentication
        - KbdInteractiveAuthentication
        - Port
        - UseDNS
        - X11Forwarding
        - AllowAgentForwarding
        - LogLevel
      register: ssh_comment_old_config

    - name: Start and enable nftables
      ansible.builtin.systemd_service:
        name: nftables
        state: started
        enabled: true

    - name: Create nftables drop-in directory
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Setup nftables
      ansible.builtin.template:
        src: nftables.conf.j2
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/nft --check --file %s
      register: nftables_config

    - name: Add user
      ansible.builtin.user:
        name: "{{ username }}"
        state: present
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true
        password: "{{ password_hash }}"
        update_password: on_create

    - name: Check user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ username }}"
        fail_key: false
      changed_when: false

    - name: Allow user to run passwordless sudo
      ansible.builtin.copy:
        content: "{{ username }} ALL=(ALL:ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ username }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Setup user SSH
      ansible.posix.authorized_key:
        user: "{{ username }}"
        state: present
        key: "{{ lookup('ansible.builtin.file', 'secrets/ssh/id_ed25519.pub') }}"
      when: ansible_facts.getent_passwd[username] is not none

    # lynis HOME-9304
    - name: Restrict user home
      ansible.builtin.file:
        path: "/home/{{ username }}"
        state: directory
        mode: "0700"

  handlers:
    - name: Restart zram swap
      ansible.builtin.systemd_service:
        name: zramswap.service
        state: restarted

  post_tasks:
    - name: Show SSH and nftables reload notice
      ansible.builtin.debug:
        msg: "SSH or nftables changed. Run the side-effect play with `--tags side_effect` after checking access so you do not lock yourself out of the server."
      when: >-
        ssh_config.changed
        or ssh_comment_old_config.changed
        or nftables_config.changed

    - name: Show nftables service rules notice
      ansible.builtin.debug:
        msg: "To reload nftables, handle rules added by existing services, e.g., Docker or Tailscale, with, e.g., restarting."
      when: >-
        'raw' not in group_names
        and nftables_config.changed

    - name: Show reboot notice
      ansible.builtin.debug:
        msg: "Reboot the host after applying this play because it is newly initialized and may have upgraded its kernel."
      when: "'raw' in group_names"

- name: Apply nftables and SSH config
  hosts: raw, hosts
  tags:
    - never
    - side_effect
  gather_facts: false
  become: true

  tasks:
    - name: Restart SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted

    # It should still reuse the legacy SSH connection after restarting SSH
    - name: Reload nftables
      ansible.builtin.command:
        cmd: nft -f /etc/nftables.conf
      changed_when: true
