---
- name: Deploy CLI Proxy API
  hosts: sg1

  vars_files:
    - secrets/secrets.yaml

  vars:
    cliproxy_local_port: 50014
    cliproxy_tailscale_port: 50015
    # The management panel is published on the Tailscale IP only, the public nginx site blocks management paths.
    cliproxy_bind_ip: "{{ cliproxy_tailscale_ip.stdout | trim }}"
    stack_dir: /opt/stacks/cli-proxy-api
    cliproxy_backup_dir: "/var/backups/cli-proxy-api/{{ ansible_facts.date_time.iso8601_basic_short }}"

  pre_tasks:
    - name: Default cliproxy_github_token
      ansible.builtin.set_fact:
        cliproxy_github_token: ""
      when: cliproxy_github_token is undefined

    - name: Check cliproxy_domain, cliproxy_cert, and cliproxy_key
      ansible.builtin.assert:
        that:
          - cliproxy_domain is defined
          - cliproxy_cert is defined
          - cliproxy_key is defined
        fail_msg: "Set cliproxy_domain, cliproxy_cert and cliproxy_key in host_vars/sg1.yaml"
        quiet: true

    - name: Check cliproxy_api_key and cliproxy_management_key
      ansible.builtin.assert:
        that:
          - cliproxy_api_key is defined
          - cliproxy_management_key is defined
        fail_msg: "Set cliproxy_api_key and cliproxy_management_key in secrets.yaml"
        quiet: true

  tasks:
    - name: Get Tailscale IPv4
      become: true
      ansible.builtin.command:
        cmd: tailscale ip -4
      register: cliproxy_tailscale_ip
      changed_when: false

    - name: Create stack dir
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create auths dir
      become: true
      ansible.builtin.file:
        path: /srv/cli-proxy-api/auths
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create plugins dir
      become: true
      ansible.builtin.file:
        path: /srv/cli-proxy-api/plugins
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Seed config
      # Seed only (force: false): the management panel edits config.yaml at runtime, re-rendering would clobber those edits
      ansible.builtin.template:
        src: cli-proxy-api/config.yaml.j2
        dest: "{{ stack_dir }}/config.yaml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0600"
        force: false
      notify: Recreate containers

    - name: Record previous container image
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{% raw %}{{.Image}}{% endraw %}"
          - cli-proxy-api
      register: cliproxy_previous_image
      changed_when: false
      failed_when: false

    - name: Back up existing deployment
      become: true
      when: cliproxy_previous_image.rc == 0
      block:
        - name: Create rollback directory
          ansible.builtin.file:
            path: "{{ cliproxy_backup_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Back up runtime config and compose
          ansible.builtin.copy:
            src: "{{ stack_dir }}/{{ item }}"
            dest: "{{ cliproxy_backup_dir }}/{{ item }}"
            remote_src: true
            owner: root
            group: root
            mode: "0600"
          loop:
            - config.yaml
            - compose.yaml

        - name: Save previous image for rollback
          ansible.builtin.copy:
            content: |
              services:
                cli-proxy-api:
                  image: {{ cliproxy_previous_image.stdout | trim }}
            dest: "{{ cliproxy_backup_dir }}/rollback.yaml"
            owner: root
            group: root
            mode: "0600"

    - name: Render compose file
      ansible.builtin.template:
        src: cli-proxy-api/compose.yaml.j2
        dest: "{{ stack_dir }}/compose.yaml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify: Recreate containers

    - name: Start containers
      community.docker.docker_compose_v2:
        project_src: "{{ stack_dir }}"
        state: present
        remove_orphans: true
        pull: always

    - name: Render nginx site
      become: true
      ansible.builtin.template:
        src: cli-proxy-api/cli-proxy-api.nginx.j2
        dest: /etc/nginx/sites-available/cli-proxy-api
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx site
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/cli-proxy-api
        dest: /etc/nginx/sites-enabled/cli-proxy-api
        state: link
      notify: Reload nginx

    - name: Apply pending container and nginx changes
      ansible.builtin.meta: flush_handlers

    - name: Migrate and verify CLI Proxy API v8
      tags: cliproxy_verify
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../scripts/ensure_cliproxy_v8.py --config {{ stack_dir }}/config.yaml --url http://127.0.0.1:{{ cliproxy_local_port }}"
        executable: /usr/bin/python3
      environment:
        CLIPROXY_MANAGEMENT_KEY: "{{ cliproxy_management_key }}"
        CLIPROXY_CLIENT_KEY: "{{ cliproxy_api_key }}"
      register: cliproxy_v8_check
      changed_when: >-
        'Migrated config to v8' in cliproxy_v8_check.stdout
        or 'Updated file logging' in cliproxy_v8_check.stdout

    - name: Show CLI Proxy API verification
      tags: cliproxy_verify
      ansible.builtin.debug:
        msg: "{{ cliproxy_v8_check.stdout_lines }}"

  handlers:
    - name: Import docker handlers
      ansible.builtin.import_tasks: tasks/docker_handlers.yaml

    - name: Import nginx handlers
      ansible.builtin.import_tasks: tasks/nginx_handlers.yaml
