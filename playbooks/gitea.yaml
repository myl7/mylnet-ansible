---
- name: Deploy gitea
  hosts: sg1

  vars:
    gitea_local_port: 50001
    gitea_ssh_bind: "{{ gitea_ssh_ip.stdout | trim }}"
    stack_dir: /opt/stacks/gitea

  pre_tasks:
    - name: Check gitea_domain, gitea_cert, and gitea_key
      ansible.builtin.assert:
        that:
          - gitea_domain is defined
          - gitea_cert is defined
          - gitea_key is defined
        fail_msg: "Set gitea_domain, gitea_cert and gitea_key"
        quiet: true

  tasks:
    # Gitea requires an IP to bind its SSH port. We use the Tailscale IP.
    - name: Get Tailscale IPv4
      become: true
      ansible.builtin.command:
        cmd: tailscale ip -4
      register: gitea_ssh_ip
      changed_when: false

    - name: Create stack dir
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Create data dir
      become: true
      ansible.builtin.file:
        path: /srv/gitea/data
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Preserve existing Gitea before updating
      when: not ansible_check_mode
      block:
        - name: Inspect existing Gitea container
          community.docker.docker_container_info:
            name: gitea-gitea-1
          register: gitea_previous

        - name: Keep previous Gitea image tagged for rollback
          community.docker.docker_image_tag:
            name: "{{ gitea_previous.container.Image }}"
            repository:
              - "mylnet/gitea:rollback-{{ gitea_previous.container.Image | replace('sha256:', '') }}"
          when: gitea_previous.exists

    - name: Render compose file
      ansible.builtin.template:
        src: gitea/compose.yaml.j2
        dest: "{{ stack_dir }}/compose.yaml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"

    - name: Start containers
      community.docker.docker_compose_v2:
        project_src: "{{ stack_dir }}"
        state: present
        remove_orphans: true
        pull: always
        wait: true
        wait_timeout: 300

    - name: Verify running Gitea
      when: not ansible_check_mode
      block:
        - name: Check Gitea health endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ gitea_local_port }}/api/healthz"
            use_proxy: false
            return_content: true
          register: gitea_health
          until: gitea_health.status == 200 and (gitea_health.json.status | default('')) == 'pass'
          retries: 12
          delay: 5

        - name: Read running Gitea version
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ gitea_local_port }}/api/v1/version"
            use_proxy: false
            return_content: true
          register: gitea_version

        - name: Check Gitea security fix is present
          ansible.builtin.assert:
            that:
              - gitea_version.json.version is version('28.4.0', '>=', version_type='semver')
            fail_msg: "The pulled Gitea image is older than the 28.4.0 security release"
            quiet: true

        - name: Record running Gitea version
          ansible.builtin.debug:
            msg: "Gitea {{ gitea_version.json.version }} is healthy"

    - name: Render nginx site
      become: true
      ansible.builtin.template:
        src: gitea/gitea.nginx.j2
        dest: /etc/nginx/sites-available/gitea
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx site
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/gitea
        dest: /etc/nginx/sites-enabled/gitea
        state: link
      notify: Reload nginx

  handlers:
    - name: Import nginx handlers
      ansible.builtin.import_tasks: tasks/nginx_handlers.yaml
