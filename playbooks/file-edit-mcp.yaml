---
- name: Deploy file-edit-mcp
  hosts: sg1

  vars:
    file_edit_mcp_local_port: 50018
    stack_dir: /opt/stacks/file-edit-mcp
    # Published from the dev machine to Docker Hub (make release in the
    # file-edit-mcp checkout); this host only ever pulls.
    file_edit_mcp_image: myl7/file-edit-mcp:v0.4.0

  vars_files:
    - secrets/secrets.yaml

  pre_tasks:
    - name: Check file_edit_mcp_domain, file_edit_mcp_cert, and file_edit_mcp_key
      ansible.builtin.assert:
        that:
          - file_edit_mcp_domain is defined
          - file_edit_mcp_cert is defined
          - file_edit_mcp_key is defined
        fail_msg: "Set file_edit_mcp_domain, file_edit_mcp_cert and file_edit_mcp_key in host_vars/sg1.yaml"
        quiet: true

    - name: Check the auth token
      ansible.builtin.assert:
        that:
          - file_edit_mcp_token is defined
          - file_edit_mcp_token | length > 0
          - file_edit_mcp_token is match('^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$')
        fail_msg: "Set file_edit_mcp_token in secrets/secrets.yaml (URL-segment safe: letters, digits, '-', '_')"
        quiet: true

  tasks:
    - name: Create stack dir
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0755"

    - name: Render compose file
      ansible.builtin.template:
        src: file-edit-mcp/compose.yaml.j2
        dest: "{{ stack_dir }}/compose.yaml"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0644"
      notify: Recreate containers

    - name: Pull and start containers
      community.docker.docker_compose_v2:
        project_src: "{{ stack_dir }}"
        state: present
        remove_orphans: true
        pull: always

    - name: Remove the obsolete basic-auth htpasswd
      become: true
      ansible.builtin.file:
        path: /etc/nginx/htpasswd/file-edit-mcp
        state: absent

    - name: Render nginx site
      become: true
      ansible.builtin.template:
        src: file-edit-mcp/file-edit-mcp.nginx.j2
        dest: /etc/nginx/sites-available/file-edit-mcp
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx site
      become: true
      ansible.builtin.file:
        src: /etc/nginx/sites-available/file-edit-mcp
        dest: /etc/nginx/sites-enabled/file-edit-mcp
        state: link
      notify: Reload nginx

  handlers:
    - name: Import docker handlers
      ansible.builtin.import_tasks: tasks/docker_handlers.yaml

    - name: Import nginx handlers
      ansible.builtin.import_tasks: tasks/nginx_handlers.yaml
