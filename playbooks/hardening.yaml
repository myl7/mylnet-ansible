---
# Bootstrap hardening for new Debian VPS hosts.
# Retired deployments are removed manually. See docs/hardening.md.
- name: Harden hosts
  hosts: hosts
  become: true

  vars:
    unwanted_services:
      - ModemManager.service # Unused
      - wpa_supplicant.service # Unused
      - netfilter-persistent.service # Redundant with nftables

  tasks:
    - name: Install security packages
      ansible.builtin.apt:
        name:
          - unattended-upgrades # lynis PKGS-7420: Apply package upgrades automatically
          - libpam-pwquality # lynis AUTH-9262: Enforce password strength
          - sysstat # lynis ACCT-9626: Collect system activity history (`sar`)
          - auditd # lynis ACCT-9628: Audit high-signal security file changes
        state: present

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Disable unwanted services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ unwanted_services }}"
      when: item in ansible_facts.services

    # The SSH port is on the public internet and takes about 19k failed logins
    # a day, 93% of them from one datacenter /24. Password and
    # keyboard-interactive auth are already off, so the cost is not access but
    # resources: pre-auth connections, the audit and btmp records they write,
    # and the journal they fill. The per-source rate limit and the blocked
    # networks live with the port rule in templates/nftables.conf.j2, because
    # they have to run before that rule to have any effect.
    #
    # What is left here is what a connection that gets through can pin.
    # MaxStartups is a memory ceiling as much as a load ceiling: every
    # unauthenticated connection holds an sshd process until it authenticates
    # or LoginGraceTime expires. Debian's default (10:30:100, 2m) allows
    # ~100 x ~6M, more than the free memory on a 2 GiB host; 10:30:30 and 20s
    # put the worst case near 170M and still leave room for parallel playbook
    # runs.
    - name: Limit SSH pre-auth connections
      ansible.builtin.copy:
        # A drop-in rather than an edit of sshd_config: init.yaml already owns
        # an ANSIBLE MANAGED BLOCK there, and a second one would collide with
        # the marker it searches for. The Include in sshd_config sits after
        # that block, so init.yaml's directives still win where they overlap.
        content: |
          # Managed by mylnet-ansible hardening.yaml.
          LoginGraceTime 20
          MaxStartups 10:30:30
        dest: /etc/ssh/sshd_config.d/99-mylnet-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH

    # lynis KRNL-5820
    - name: Disable core dumps
      ansible.builtin.copy:
        content: |
          * hard core 0
          * soft core 0
        dest: /etc/security/limits.d/10-disable-coredumps.conf
        owner: root
        group: root
        mode: "0644"

    # lynis USB-1000
    - name: Blacklist USB storage driver
      ansible.builtin.copy:
        content: "install usb-storage /bin/true\n"
        dest: /etc/modprobe.d/usb-storage.conf
        owner: root
        group: root
        mode: "0644"
      register: modprobe_usb_config

    # lynis STRG-1846
    - name: Blacklist FireWire drivers
      ansible.builtin.copy:
        content: |
          install firewire-core /bin/true
          install firewire-ohci /bin/true
          install firewire-sbp2 /bin/true
        dest: /etc/modprobe.d/firewire.conf
        owner: root
        group: root
        mode: "0644"
      register: modprobe_firewire_config

    # lynis NETW-3200
    - name: Blacklist unused network protocols
      ansible.builtin.copy:
        content: |
          install dccp /bin/true
          install sctp /bin/true
          install rds /bin/true
          install tipc /bin/true
        dest: /etc/modprobe.d/netprotocols.conf
        owner: root
        group: root
        mode: "0644"
      register: modprobe_unused_net_proto_config

    # lynis PKGS-7420: Apply package upgrades automatically
    - name: Enable periodic apt update and upgrade
      ansible.builtin.copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"

    - name: Unmask apt-daily services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: false
      loop:
        - apt-daily.service
        - apt-daily-upgrade.service

    - name: Unmask and enable apt-daily timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: false
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    # Some VPS kernels ship without CONFIG_AUDIT, so auditctl and augenrules
    # cannot reach the netlink audit socket. Skip the auditd subsystem there.
    - name: Probe kernel audit support
      ansible.builtin.command:
        cmd: auditctl -s
      register: audit_probe
      changed_when: false
      failed_when: false

    - name: Set audit support fact
      ansible.builtin.set_fact:
        audit_supported: "{{ audit_probe.rc == 0 }}"

    # lynis ACCT-9628: Audit security-sensitive file changes
    - name: Install auditd watch rules
      ansible.builtin.copy:
        src: auditd/hardening.rules
        dest: /etc/audit/rules.d/99-mylnet-hardening.rules
        owner: root
        group: root
        mode: "0640"
      notify: Load auditd rules
      when: audit_supported

    - name: Start and enable auditd
      ansible.builtin.systemd_service:
        name: auditd
        enabled: true
        state: started
      when: audit_supported

    - name: Disable auditd without kernel audit support
      ansible.builtin.systemd_service:
        name: auditd
        enabled: false
        state: stopped
      when: not audit_supported

    # lynis ACCT-9626
    - name: Enable sysstat collection
      ansible.builtin.lineinfile:
        path: /etc/default/sysstat
        create: false
        regexp: "^ENABLED="
        line: 'ENABLED="true"'

    # lynis ACCT-9626
    - name: Start and enable sysstat timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - sysstat-collect.timer
        - sysstat-summary.timer

    # lynis KRNL-6000
    - name: Harden kernel and network sysctls
      ansible.builtin.copy:
        src: sysctl/hardening.conf
        # zz- sorts after 99-protect-links.conf, which also sets fs.protected_fifos
        dest: /etc/sysctl.d/zz-mylnet-hardening.conf
        owner: root
        group: root
        mode: "0644"
      notify: Apply sysctl

    - name: Create journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Persist and cap systemd journal
      ansible.builtin.copy:
        content: |
          [Journal]
          Storage=persistent
          SystemMaxUse=200M
          SystemMaxFileSize=25M
          MaxRetentionSec=1month
        dest: /etc/systemd/journald.conf.d/persist.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald

  post_tasks:
    - name: Show reboot notice
      ansible.builtin.debug:
        msg: "Reboot the host after applying this play because kernel module config changed."
      when: >-
        modprobe_usb_config.changed
        or modprobe_firewire_config.changed
        or modprobe_unused_net_proto_config.changed

  handlers:
    # Reload, not restart: sshd re-execs and keeps existing sessions alive.
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

    - name: Load auditd rules
      ansible.builtin.command:
        cmd: augenrules --load
      changed_when: true
      when: audit_supported

    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted

    - name: Apply sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true
